<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img">
<title>Why the single-chain theorem becomes quartic</title>
<rect width="900" height="500" fill="#ffffff" rx="18"/>
<text x="52" y="52" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">Why the single-chain theorem becomes quartic</text>
<text x="52" y="78" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">The η′ factor is essential; omitting it is the failing negative control</text>
<rect x="40" y="170" width="115" height="105" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="97.5" y="207.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">Rθ</text>
<text x="97.5" y="243.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">η′⁻¹ᐟ²</text>
<line x1="155" y1="222" x2="180" y2="222" stroke="#64748b" stroke-width="2"/>
<path d="M 180 222 l -9 -6 l 0 12 z" fill="#64748b"/>
<rect x="190" y="170" width="115" height="105" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="247.5" y="207.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">λ²</text>
<text x="247.5" y="243.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">η′¹ᐟ² η</text>
<line x1="305" y1="222" x2="330" y2="222" stroke="#64748b" stroke-width="2"/>
<path d="M 330 222 l -9 -6 l 0 12 z" fill="#64748b"/>
<rect x="340" y="170" width="115" height="105" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="397.5" y="207.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">Gconst</text>
<text x="397.5" y="243.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">η′⁻¹ η⁻¹</text>
<line x1="455" y1="222" x2="480" y2="222" stroke="#64748b" stroke-width="2"/>
<path d="M 480 222 l -9 -6 l 0 12 z" fill="#64748b"/>
<rect x="490" y="170" width="115" height="105" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="547.5" y="207.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">α / ζ</text>
<text x="547.5" y="243.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">η⁻² T⁻¹</text>
<line x1="605" y1="222" x2="630" y2="222" stroke="#64748b" stroke-width="2"/>
<path d="M 630 222 l -9 -6 l 0 12 z" fill="#64748b"/>
<rect x="640" y="170" width="115" height="105" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="697.5" y="207.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">error</text>
<text x="697.5" y="243.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">η′⁻¹ η⁻³ T⁻¹</text>
<rect x="267" y="330" width="366" height="70" rx="14" fill="#ecfdf5" stroke="#0f9f8f" stroke-width="2"/>
<text x="450.0" y="357.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f9f8f">common regime η′ = Θ(η)</text>
<text x="450.0" y="384.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f9f8f">η⁻⁴ T⁻¹</text>
