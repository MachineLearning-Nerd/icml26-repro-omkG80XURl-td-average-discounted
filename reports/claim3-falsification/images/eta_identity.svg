<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Condition number eta1 equals one over dimension in the admissible controlled family">
  <rect width="900" height="420" rx="22" fill="#f8fafc"/>
  <text x="48" y="52" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172033">In the admissible family, η₁ and d cannot be separated</text>
  <text x="48" y="81" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Uniform chain, Φ=I, normalized full-rank features: η₁=1/d exactly</text>
  <line x1="105" y1="340" x2="830" y2="340" stroke="#94a3b8" stroke-width="2"/>
  <line x1="105" y1="105" x2="105" y2="340" stroke="#94a3b8" stroke-width="2"/>
  <polyline points="155,130 355,230 555,280 755,305" fill="none" stroke="#0f9f8f" stroke-width="5"/>
  <g fill="#0f9f8f">
    <circle cx="155" cy="130" r="8"/><circle cx="355" cy="230" r="8"/>
    <circle cx="555" cy="280" r="8"/><circle cx="755" cy="305" r="8"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">
    <text x="155" y="118">0.200</text><text x="355" y="218">0.100</text>
    <text x="555" y="268">0.050</text><text x="755" y="293">0.025</text>
    <text x="155" y="368">d=5</text><text x="355" y="368">d=10</text>
    <text x="555" y="368">d=20</text><text x="755" y="368">d=40</text>
  </g>
  <rect x="550" y="118" width="275" height="72" rx="12" fill="#ccfbf1"/>
  <text x="687" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">log d = log η₁⁻¹</text>
  <text x="687" y="171" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#115e59">an observed slope cannot identify both</text>
</svg>
