<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Peer eta1 compared with the normalized-feature upper bound at dimension 40">
  <rect width="900" height="430" rx="22" fill="#f8fafc"/>
  <text x="48" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172033">The proposed counterexample breaks a paper assumption</text>
  <text x="48" y="82" font-family="Arial,sans-serif" font-size="15" fill="#64748b">At d=40, normalized features force η₁ ≤ 3/d = 0.075</text>
  <line x1="92" y1="350" x2="820" y2="350" stroke="#94a3b8" stroke-width="2"/>
  <line x1="92" y1="110" x2="92" y2="350" stroke="#94a3b8" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-size="13" fill="#64748b">
    <text x="58" y="354">0.0</text><text x="58" y="274">0.2</text>
    <text x="58" y="194">0.4</text><text x="58" y="114">0.6</text>
  </g>
  <rect x="200" y="320" width="190" height="30" rx="8" fill="#0f9f8f"/>
  <text x="295" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f766e">0.075</text>
  <text x="295" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">largest admissible η₁</text>
  <rect x="510" y="173" width="190" height="177" rx="8" fill="#dc2626"/>
  <text x="605" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#b91c1c">0.443</text>
  <text x="605" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">peer-reported η₁</text>
  <rect x="720" y="190" width="120" height="54" rx="12" fill="#fee2e2"/>
  <text x="780" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#991b1b">5.91× over</text>
  <text x="780" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#991b1b">the bound</text>
</svg>
